version: "3.9"
services:
  script-server:
    build:
      dockerfile: Dockerfile
    image: davis8988/script-server:latest
    container_name: script-server
    restart: always
    ports:
      - 5000:5000
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./conf/conf-runtime.json:/app/conf/conf.json
      # - ./conf/runners/:/app/conf/runners
      # - ./conf/scripts/:/app/conf/scripts
      # - ./conf/logs/:/app/conf/scripts
